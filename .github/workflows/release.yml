name: Release

# Official tags are X.Y.Z and must be reachable from main. Beta tags are
# X.Y.Z-beta.N and must be reachable from beta. Both channels run the same
# checks.yml gate and publish assets built from the exact tagged commit.
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

# Duplicate deliveries of one tag must not both pass the no-existing-release
# check. Different tags validate independently; the publication job has a
# separate fixed mutex and chooses latest while publishing the immutable draft.
concurrency:
  group: 5gpn-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      make_latest: ${{ steps.release.outputs.make_latest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Classify tag and verify branch provenance
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          number='(0|[1-9][0-9]*)'
          stable_re="^${number}\.${number}\.${number}$"
          beta_re="^${number}\.${number}\.${number}-beta\.([1-9][0-9]*)$"

          if [[ "$tag" =~ $stable_re ]]; then
            channel=stable
            required_branch=main
            prerelease=false
            make_latest=true
          elif [[ "$tag" =~ $beta_re ]]; then
            channel=beta
            required_branch=beta
            prerelease=true
            make_latest=false
          else
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/beta:refs/remotes/origin/beta'
          git fetch --force --tags origin
          tagged_commit="$(git rev-list -n 1 "$tag")"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          [[ "$tagged_commit" == "$event_commit" ]] \
            || { echo "Tag $tag moved: event $event_commit, current $tagged_commit." >&2; exit 1; }
          git merge-base --is-ancestor "$tagged_commit" "refs/remotes/origin/${required_branch}" \
            || { echo "Tag $tag is not reachable from ${required_branch}." >&2; exit 1; }

          decimal_gt() {
            local left="$1" right="$2"
            local LC_ALL=C
            (( ${#left} > ${#right} )) && return 0
            (( ${#left} < ${#right} )) && return 1
            [[ "$left" > "$right" ]]
          }
          stable_gt() {
            local left="$1" right="$2" li ri
            local -a lparts rparts
            IFS=. read -r -a lparts <<< "$left"
            IFS=. read -r -a rparts <<< "$right"
            for li in 0 1 2; do
              ri="${rparts[$li]}"
              decimal_gt "${lparts[$li]}" "$ri" && return 0
              decimal_gt "$ri" "${lparts[$li]}" && return 1
            done
            return 1
          }

          if [[ "$channel" == stable ]]; then
            while IFS= read -r existing; do
              [[ "$existing" == "$tag" || ! "$existing" =~ $stable_re ]] && continue
              stable_gt "$tag" "$existing" \
                || { echo "Stable release $tag is not newer than $existing." >&2; exit 1; }
            done < <(git tag --list)
          else
            base="${tag%-beta.*}"
            current_number="${tag##*.}"
            while IFS= read -r existing; do
              [[ "$existing" == "$tag" ]] && continue
              existing_number="${existing#"${base}-beta."}"
              [[ "$existing_number" =~ ^[1-9][0-9]*$ ]] || continue
              decimal_gt "$current_number" "$existing_number" \
                || { echo "Beta sequence $tag is not newer than $existing." >&2; exit 1; }
            done < <(git tag --list "${base}-beta.*")
          fi

          {
            echo "channel=$channel"
            echo "prerelease=$prerelease"
            echo "make_latest=$make_latest"
          } >> "$GITHUB_OUTPUT"

  gate:
    needs: classify
    uses: ./.github/workflows/checks.yml

  build:
    needs: [classify, gate]
    runs-on: ubuntu-latest
    concurrency:
      group: 5gpn-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Revalidate immutable release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ needs.classify.outputs.channel }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git fetch --force --tags origin
          tagged_commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          [[ "$tagged_commit" == "$event_commit" ]] \
            || { echo "Tag moved after validation: $tagged_commit != $event_commit" >&2; exit 1; }
          if [[ "$RELEASE_CHANNEL" == stable ]]; then
            decimal_gt() {
              local left="$1" right="$2"
              local LC_ALL=C
              (( ${#left} > ${#right} )) && return 0
              (( ${#left} < ${#right} )) && return 1
              [[ "$left" > "$right" ]]
            }
            stable_gt() {
              local left="$1" right="$2" index
              local -a lparts rparts
              IFS=. read -r -a lparts <<< "$left"
              IFS=. read -r -a rparts <<< "$right"
              for index in 0 1 2; do
                decimal_gt "${lparts[$index]}" "${rparts[$index]}" && return 0
                decimal_gt "${rparts[$index]}" "${lparts[$index]}" && return 1
              done
              return 1
            }
            number='(0|[1-9][0-9]*)'
            stable_re="^${number}\.${number}\.${number}$"
            while IFS= read -r existing; do
              [[ "$existing" == "$GITHUB_REF_NAME" || ! "$existing" =~ $stable_re ]] && continue
              stable_gt "$GITHUB_REF_NAME" "$existing" \
                || { echo "Stable release $GITHUB_REF_NAME is not newer than $existing." >&2; exit 1; }
            done < <(git tag --list)
          fi

      # No toolchain is set up here any more. This repository builds nothing:
      # the daemon and the control-console SPA it used to compile were deleted
      # with the three-process layout. The sole long-running executable and the
      # static zashboard bundle are released from their own repositories under
      # their own digest pins. What ships from here is the installer bundle and
      # the digest that binds it.

      # The bundle contains every first-party installer input and is stamped to
      # this exact tag. The quick installer never falls back to branch content.
      - name: Package installer bundle
        run: |
          set -euo pipefail
          stage="installer-bundle"
          [[ ! -e "$stage" ]] \
            || { echo "Refusing to reuse existing bundle stage: $stage" >&2; exit 1; }

          # This is the complete installer-bundle policy. Runtime helpers are
          # listed individually so a repository-only helper cannot become
          # gateway payload by merely landing in scripts/.
          # scripts/run-suites.sh is a development-only test runner and must not
          # ship in a release bundle.
          bundle_files=(
            install.sh
            quick-install.sh
            README.md
            README.en.md
            LICENSE
            THIRD_PARTY_NOTICES.md
            # Centralized third-party coordinates and their non-executing parser.
            release/pins.env
            release/pins.sh
            # Public contract for the exact six-key installer-input schema.
            etc/5gpn/dns.env.example
            etc/mihomo/config.yaml.tmpl
            etc/systemd/5gpn-certbot-renew.service
            etc/systemd/5gpn-certbot-renew.timer
            etc/systemd/5gpn-intercept-cert.path
            etc/systemd/5gpn-intercept-cert.service
            etc/systemd/5gpn-intercept-cert.timer
            etc/systemd/5gpn-mihomo.service
            # Runtime helpers installed under /opt/5gpn/scripts.
            scripts/publication-fs.sh
            scripts/cert-role-ctl.sh
            scripts/cert-renew.sh
            scripts/configure-runtime-gate.sh
            scripts/gen-ios-profile.sh
            scripts/intercept-cert-renew.sh
            scripts/renew-hook.sh
            scripts/ui-generation.sh
            docs/architecture.md
            docs/native-extensions.md
            # Acceptance routing and root-owned runbooks; no executable mega-suite.
            tests/integration-smoke.md
            tests/deployment-smoke.md
            tests/acceptance/installer.md
            tests/acceptance/disruption-recovery.md
          )
          executable_files=(
            install.sh
            quick-install.sh
            scripts/publication-fs.sh
            scripts/cert-role-ctl.sh
            scripts/cert-renew.sh
            scripts/configure-runtime-gate.sh
            scripts/gen-ios-profile.sh
            scripts/intercept-cert-renew.sh
            scripts/renew-hook.sh
            scripts/ui-generation.sh
          )

          mkdir -p "$stage"
          for file in "${bundle_files[@]}"; do
            install -D -m 0644 "$file" "$stage/$file"
          done
          for file in "${executable_files[@]}"; do
            chmod 0755 "$stage/$file"
          done

          pins_env_sha="$(sha256sum "$stage/release/pins.env" | awk '{print $1}')"
          pins_library_sha="$(sha256sum "$stage/release/pins.sh" | awk '{print $1}')"
          quick_sha="$(sha256sum "$stage/quick-install.sh" | awk '{print $1}')"
          pins_binding="${pins_env_sha}:${pins_library_sha}"
          sed -i "s/^RELEASE_PINS_BINDING=.*/RELEASE_PINS_BINDING=\"${pins_binding}\"/" "$stage/install.sh"
          grep -q "^RELEASE_PINS_BINDING=\"${pins_binding}\"$" "$stage/install.sh" \
            || { echo "RELEASE_PINS_BINDING stamp failed"; exit 1; }
          sed -i "s/^RELEASE_QUICK_BINDING=.*/RELEASE_QUICK_BINDING=\"${quick_sha}\"/" "$stage/install.sh"
          grep -q "^RELEASE_QUICK_BINDING=\"${quick_sha}\"$" "$stage/install.sh" \
            || { echo "RELEASE_QUICK_BINDING stamp failed"; exit 1; }
          sed -i "s/^RELEASE_TAG=.*/RELEASE_TAG=\"${GITHUB_REF_NAME}\"/" "$stage/install.sh"
          grep -q "^RELEASE_TAG=\"${GITHUB_REF_NAME}\"" "$stage/install.sh" \
            || { echo "RELEASE_TAG stamp failed"; exit 1; }

          expected_manifest="$RUNNER_TEMP/5gpn-installer-expected.txt"
          actual_manifest="$RUNNER_TEMP/5gpn-installer-actual.txt"
          printf '%s\n' "${bundle_files[@]}" | LC_ALL=C sort > "$expected_manifest"
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > "$actual_manifest"
          diff -u "$expected_manifest" "$actual_manifest"

          tar czf 5gpn-installer.tar.gz -C "$stage" .

          # Re-read the completed archive rather than trusting only the stage.
          # This closes the gap where a later packaging command could add or
          # replace an entry after the staged manifest passed.
          archive_root="$(mktemp -d "${RUNNER_TEMP}/5gpn-installer-archive.XXXXXX")"
          archive_manifest="$RUNNER_TEMP/5gpn-installer-archive.txt"
          tar xzf 5gpn-installer.tar.gz -C "$archive_root"
          find "$archive_root" -type f -printf '%P\n' | LC_ALL=C sort > "$archive_manifest"
          diff -u "$expected_manifest" "$archive_manifest"
          unexpected_archive_entry="$(
            find "$archive_root" -mindepth 1 ! -type d ! -type f -print -quit
          )"
          [[ -z "$unexpected_archive_entry" ]] \
            || { echo "Unexpected non-file archive entry: $unexpected_archive_entry" >&2; exit 1; }

          sha256sum 5gpn-installer.tar.gz > checksums.txt

      - name: Collect exact release assets
        run: |
          mkdir release-assets
          cp 5gpn-installer.tar.gz checksums.txt THIRD_PARTY_NOTICES.md release-assets/

      - name: Revalidate release identity immediately before publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tagged_commit="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          event_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          [[ "$tagged_commit" == "$event_commit" ]] \
            || { echo "Tag moved before publication: $tagged_commit != $event_commit" >&2; exit 1; }
          api_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}"
          if ! release_status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api_url")"; then
            echo "Could not verify whether release $GITHUB_REF_NAME already exists." >&2
            exit 1
          fi
          case "$release_status" in
            404) ;;
            200) echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite it." >&2; exit 1 ;;
            *) echo "Release existence check returned HTTP $release_status." >&2; exit 1 ;;
          esac

      - name: Create release draft and upload assets
        id: release_draft
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ needs.classify.outputs.prerelease }}
          # The final PATCH below chooses latest while publishing the draft.
          make_latest: false
          fail_on_unmatched_files: true
          files: release-assets/*

      - name: Publish and verify immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRERELEASE: ${{ needs.classify.outputs.prerelease }}
          RELEASE_MAKE_LATEST: ${{ needs.classify.outputs.make_latest }}
          RELEASE_ID: ${{ steps.release_draft.outputs.id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[1-9][0-9]*$ ]]
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease="$RELEASE_PRERELEASE" \
            -f make_latest="$RELEASE_MAKE_LATEST" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            | jq -e --arg tag "$GITHUB_REF_NAME" \
                --argjson prerelease "$RELEASE_PRERELEASE" '
                .tag_name == $tag and
                .draft == false and
                .prerelease == $prerelease and
                .immutable == true and
                ([.assets[].name] | sort) == [
                  "5gpn-installer.tar.gz",
                  "THIRD_PARTY_NOTICES.md",
                  "checksums.txt"
                ]
              ' >/dev/null
