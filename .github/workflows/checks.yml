name: Checks

# Reusable gate: the single source of truth for "is this tree shippable?".
# Called by ci.yml (every branch push / PR) AND by release.yml (SemVer tags), so
# the release gate is byte-identical to day-to-day CI and the two can never
# drift. Do not add checks to ci.yml or release.yml directly — add them here.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Zero-dependency shell gate: every operator-facing entrypoint must parse
  # (bash -n) and pass the pure-grep policy tests (no Python / Go / node needed).
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: bash -n syntax gate
        run: |
          set -euo pipefail
          for s in install.sh quick-install.sh release/*.sh scripts/*.sh \
                   docker/*.sh tests/container-acceptance.sh tests/docker/*.sh; do
            echo "--- bash -n $s ---"; bash -n "$s"
          done
      - name: Shell policy tests
        run: |
          set -euo pipefail
          for t in tests/test_*.sh; do
            echo "--- $t ---"; bash "$t"
          done
      - name: Root certificate-role recovery gate
        run: sudo bash tests/test_cert_role_ctl.sh
      - name: Root configure runtime gates
        run: |
          sudo bash tests/test_configure_runtime_gate.sh
          sudo bash tests/test_configure_boundary.sh

  # There is no Go or web gate here any more. The daemon and the control-console
  # SPA this repository used to build were deleted with the three-process layout;
  # the Go that replaced them lives in the mihomo fork and the UI in the
  # zashboard fork, each gated by its own CI before it is ever released. What is
  # remains here is shell plus Docker assembly, so the shell, pinned-artifact,
  # image-build, manifest-corpus, and seed-parser jobs below are the complete
  # hosted check surface. Real cgroup behavior remains on test-env.

  # Validate the committed seed and the optional ingress-module candidate with
  # the exact pinned data-plane binary. The digest prevents a mutable upstream
  # artifact from changing this gate.
  artifact-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      # release/pins.env pins each third-party artifact as a PAIR: a version and the
      # SHA-256 of the asset that version publishes. Nothing bound the two
      # together, so a version bump that left its digest behind shipped an
      # installer that downloaded the right artifact, hashed it correctly, and
      # refused it -- discovered only by installing 0.0.57 on a gateway, because
      # that is the only place the digest was ever checked.
      #
      # This is a separate job rather than a step in `shell`, because the local
      # suite is deliberately offline and deterministic. It strictly parses the
      # bundled manifest instead of restating pins, and fails rather than skips when
      # an artifact cannot be fetched.
      - name: Verify pinned artifacts against their published releases
        run: bash tests/verify-artifact-pins.sh

  # Build the real image context only after the independent pin-verification
  # job succeeds. Component preparation loads the single authoritative
  # release/pins.env through release/pins.sh, verifies those digests, and leaves
  # a manifest that is also copied into the image. Nothing here starts the gateway: a GitHub-hosted
  # runner cannot prove writable cgroup-v2 delegation or clone3-into-cgroup.
  # The authoritative runtime gate is tests/container-acceptance.sh on test-env.
  docker-image:
    needs: artifact-pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Prepare digest-pinned Docker components
        run: |
          set -euo pipefail
          bash docker/prepare-components.sh
          grep -Fxq 'MIHOMO_SOURCE=pinned-release' docker/build/components/manifest.env
          grep -Fxq 'MIHOMO_CONTAINER_CONTRACT=5gpn-container-runtime-v2' \
            docker/build/components/manifest.env
      - name: Build the Linux amd64 image
        shell: bash
        run: |
          set -euo pipefail
          label_args=()
          while IFS= read -r label; do
            [[ "$label" == *=* ]] || { echo "Malformed component label: $label" >&2; exit 1; }
            label_args+=(--label "$label")
          done < <(bash docker/prepare-components.sh --print-labels)
          ((${#label_args[@]} == 20)) \
            || { echo "Expected ten component labels." >&2; exit 1; }
          docker build --platform linux/amd64 \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --build-arg "VERSION=ci-${GITHUB_SHA}" \
            "${label_args[@]}" \
            --tag 5gpn:ci .
      - name: Inspect image without starting the gateway
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(docker image inspect --format '{{.Architecture}}' 5gpn:ci)" == amd64 ]]
          docker image inspect 5gpn:ci \
            | jq -e '.[0].Config.User == "10001:10001" and
                     .[0].Config.Entrypoint == ["/opt/5gpn/bin/docker-entrypoint.sh"] and
                     (.[0].Config.Env | any(. == "FIVEGPN_RUNTIME=container"))' >/dev/null
          docker run --rm --entrypoint /bin/sh 5gpn:ci -ec '
            test "$(id -u):$(id -g)" = 10001:10001
            test -x /opt/5gpn/bin/5gpn-mihomo
            test -x /opt/5gpn/bin/docker-entrypoint.sh
            test -x /opt/5gpn/scripts/docker-public-cert.sh
            test -x /opt/5gpn/scripts/docker-intercept-cert.sh
            test -x /opt/5gpn/scripts/publication-fs.sh
            test -x /opt/5gpn/scripts/cert-role-ctl.sh
            test -x /opt/5gpn/scripts/ui-generation.sh
            test -x /opt/5gpn/scripts/gen-ios-profile.sh
            test -f /usr/share/5gpn/ui/index.html
            test -f /usr/share/5gpn/components.env
            test -f /usr/share/doc/5gpn/LICENSE
            test -f /usr/share/doc/5gpn/THIRD_PARTY_NOTICES.md
          '
          docker run --rm --entrypoint /bin/cat 5gpn:ci \
            /usr/share/5gpn/components.env > "$RUNNER_TEMP/image-components.env"
          diff -u docker/build/components/manifest.env "$RUNNER_TEMP/image-components.env"
          # This is intentionally the end of hosted-runner coverage. Do not add
          # a privileged/unconfined start here and call it an isolation test.

  # The manifests maintained in the separate first-party repository are an
  # input contract of the exact core this installer ships. Pin both sides so a
  # later mutable branch cannot turn an already-reviewed release green or red.
  official-extension-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Parse centralized release pins
        id: release_pins
        shell: bash
        run: |
          set -euo pipefail
          source release/pins.sh
          load_release_pins release/pins.env
          printf 'mihomo_repo=%s\n' "$MIHOMO_REPO" >> "$GITHUB_OUTPUT"
          printf 'mihomo_version=%s\n' "$MIHOMO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: ${{ steps.release_pins.outputs.mihomo_repo }}
          ref: ${{ steps.release_pins.outputs.mihomo_version }}
          path: 5gpn-core
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: moooyo/5gpn-extensions
          ref: e5c550c46e819a06e078751ee9a245dda07bcbe7
          path: official-extensions
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: 5gpn-core/go.mod
          cache-dependency-path: 5gpn-core/go.sum
      - name: Validate official manifests with the shipped core parser
        working-directory: 5gpn-core
        env:
          FIVEGPN_EXTENSIONS_ROOT: ${{ github.workspace }}/official-extensions
        run: |
          set -euo pipefail
          grep -Fq 'func TestOfficialExtensionManifestParserCorpus' 5gpn/engine/module_mock_test.go
          go test ./5gpn/engine -count=1 -run '^TestOfficialExtensionManifestParserCorpus$'

  mihomo-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Download pinned mihomo
        run: |
          set -euo pipefail
          source release/pins.sh
          load_release_pins release/pins.env
          asset="$(release_asset_name mihomo)"
          url="$(release_download_url mihomo)"
          digest="$(release_artifact_sha256 mihomo)"
          curl -fsSL "$url" -o "/tmp/$asset"
          echo "${digest}  /tmp/$asset" | sha256sum -c -
          gzip -dc "/tmp/$asset" > /tmp/mihomo
          chmod 0755 /tmp/mihomo
      - name: Validate current state with the shipped core
        run: |
          set -euo pipefail
          state="$(mktemp -d)"
          cases="$(mktemp -d)"
          trap 'rm -rf "$state" "$cases"' EXIT
          jq -n '{
            listen: {
              dot: ":853",
              debug: "127.0.0.1:5353",
              origin: "127.0.0.1:5354",
              certificate: "/etc/5gpn/cert/dot/current/fullchain.pem",
              privateKey: "/etc/5gpn/cert/dot/current/privkey.pem"
            },
            gateway: "10.0.0.1",
            upstreams: {china: ["223.5.5.5:53"], trust: ["22.22.22.22:53"], ecs: ""},
            policy: {rules: [], fallback: "auto"},
            tuning: {}
          }' > "$state/dns.json"
          jq -n '{
            version: 6,
            execution_order: [],
            tls_cert: "/etc/5gpn/intercept/tls/fullchain.pem",
            tls_key: "/etc/5gpn/intercept/tls/privkey.pem",
            mitm: {enabled: false, http2: true, http3: false},
            modules: [],
            catalogs: []
          }' > "$state/intercept.json"
          jq -n '{version: 1, enabled: false, token: "", admins: [], alerts: false}' \
            > "$state/bot.json"
          chmod 0600 "$state"/*.json
          /tmp/mihomo 5gpn-state validate --owner-uid "$(id -u)" "$state" \
            | jq -e '
                .status == "ok"
                and (.validated | sort) == ["bot.json", "dns.json", "intercept.json"]
                and .missing == []
              '
          /tmp/mihomo 5gpn-state validate --owner-uid "$(id -u)" "$cases/missing" \
            | jq -e '
                .status == "ok" and .validated == []
                and (.missing | sort) == ["bot.json", "dns.json", "intercept.json"]
              '
          mkdir "$cases/malformed" "$cases/wrong-owner" "$cases/wrong-mode" \
            "$cases/symlink" "$cases/hardlink"
          printf '{\n' > "$cases/malformed/dns.json"
          cp "$state/dns.json" "$cases/wrong-owner/dns.json"
          cp "$state/dns.json" "$cases/wrong-mode/dns.json"
          ln -s "$state/dns.json" "$cases/symlink/dns.json"
          cp "$state/dns.json" "$cases/hardlink/dns.json"
          ln "$cases/hardlink/dns.json" "$cases/hardlink/extra-link"
          chmod 0600 "$cases/malformed/dns.json" "$cases/wrong-owner/dns.json" \
            "$cases/hardlink/dns.json"
          chmod 0644 "$cases/wrong-mode/dns.json"
          sudo chown root:root "$cases/wrong-owner/dns.json"
          for invalid in malformed wrong-mode symlink hardlink; do
            if /tmp/mihomo 5gpn-state validate --owner-uid "$(id -u)" "$cases/$invalid" >/dev/null 2>&1; then
              echo "state validator accepted invalid $invalid fixture" >&2
              exit 1
            fi
          done
          if sudo /tmp/mihomo 5gpn-state validate --owner-uid "$(id -u)" "$cases/wrong-owner" >/dev/null 2>&1; then
            echo "state validator accepted a wrong-owner fixture" >&2
            exit 1
          fi
      - name: Render and validate the seed the installer publishes
        run: |
          set -euo pipefail
          runtime="$(mktemp -d)"
          trap 'rm -rf "$runtime"' EXIT
          awk '
            $0 == "__MIHOMO_LISTENERS__" {
              print "  - {name: gateway, type: tunnel, listen: 203.0.113.10, port: 443, network: [tcp, udp], target: console.example.test:443}"
              print "  - {name: gateway80, type: tunnel, listen: 203.0.113.10, port: 80, network: [tcp], target: console.example.test:80}"
              print "  - {name: gateway8080, type: tunnel, listen: 203.0.113.10, port: 8080, network: [tcp], target: console.example.test:8080}"
              print "  - {name: gateway8443, type: tunnel, listen: 203.0.113.10, port: 8443, network: [tcp], target: console.example.test:8443}"
              next
            }
            {
              gsub(/__CONSOLE_DOMAIN__/, "console.example.test")
              gsub(/__CONTROLLER_SECRET__/, "ci-controller-secret")
              print
            }
          ' etc/mihomo/config.yaml.tmpl > "$runtime/config.yaml"
          if grep -Eq '__[A-Z0-9_]+__' "$runtime/config.yaml"; then
            echo "unresolved mihomo template placeholder" >&2
            exit 1
          fi
          # The unit's SAFE_PATHS, because the question is whether the core
          # accepts this config as the service will run it. The seed names the
          # certificates it serves and the UI bundle at external-ui, all outside
          # its own home, so a bare -t rejects a config that runs fine.
          export SAFE_PATHS=/etc/5gpn/cert/console:/etc/5gpn/cert/dot:/etc/5gpn/intercept/tls:/opt/5gpn/ui
          /tmp/mihomo -t -f "$runtime/config.yaml" -d "$runtime"
          ! grep -Fq '5060' "$runtime/config.yaml"
          # The UI is served by this process from the path the unit grants, and
          # the seed has to say so: without external-ui the controller serves no
          # bundle, and with a path the unit does not list the service cannot
          # start at all.
          grep -Fq 'external-ui: /opt/5gpn/ui/current' "$runtime/config.yaml"
          # The panel is served on the console name. The controller has to
          # listen on :443 for the console's DIRECT dial to land on it, and the
          # allow rule has to keep the IN-TYPE,INNER exclusion -- with the
          # source allowlist gone that is the only qualifier left, and without
          # it a captured extension reaches the management plane.
          grep -Fq 'external-controller-tls: 127.0.0.1:443' "$runtime/config.yaml"
          grep -Fq 'AND,((NOT,((IN-TYPE,INNER))),(DOMAIN,console.example.test)),DIRECT' "$runtime/config.yaml"
          # The allowlist is gone: no rule may read a rule-provider the installer
          # no longer ships, because that config does not load at all.
          ! grep -Fq 'RULE-SET,whitelist' "$runtime/config.yaml"
          ! grep -Fq 'rule-providers:' "$runtime/config.yaml"
          grep -Fq 'DOMAIN,console.example.test,REJECT' "$runtime/config.yaml"
          ! grep -Fq 'zash.example.test' "$runtime/config.yaml"
          # HTTP/3 interception is unsupported. This fixed guard rejects every
          # gateway UDP/443 flow so capable clients fall back to captured TCP.
          # It is independent of the MITM master switch and has no product
          # management off switch.
          grep -Fq 'AND,((NETWORK,UDP),(DST-PORT,443)),REJECT' "$runtime/config.yaml"
          if /tmp/mihomo 5gpn-config inspect-controller --config "$runtime/config.yaml" >/dev/null 2>&1; then
            echo "controller inspector unexpectedly accepted a non-root caller" >&2
            exit 1
          fi
          expected_revision="$(sha256sum "$runtime/config.yaml" | awk '{print $1}')"
          sudo chown root:root "$runtime/config.yaml"
          sudo chmod 0640 "$runtime/config.yaml"
          sudo /tmp/mihomo 5gpn-config inspect-controller --config "$runtime/config.yaml" \
            | jq -cse --arg revision "$expected_revision" '
                select(length == 1) | .[0] | select(
                type == "object" and .version == 2
                and ((keys | sort) == ["certificate","external_controller_tls","external_ui","private_key","raw_revision","secret","version"])
                and .raw_revision == $revision
                and .secret == "ci-controller-secret"
                and .external_controller_tls == "127.0.0.1:443"
                and .external_ui == "/opt/5gpn/ui/current"
                and .certificate == "/etc/5gpn/cert/console/current/fullchain.pem"
                and .private_key == "/etc/5gpn/cert/console/current/privkey.pem"
                )'
      # The released monolith intentionally refuses to start outside the
      # systemd 257 private delegated cgroup boundary. A GitHub-hosted runner
      # cannot satisfy that production startup contract. The regression script
      # remains a seed renderer and is exercised only in a compatible deployed
      # integration environment; this job limits itself to parser/config gates.
