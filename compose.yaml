services:
  gateway:
    image: ${FIVEGPN_IMAGE:?set FIVEGPN_IMAGE to the exact ghcr.io/moooyo/5gpn tag@sha256:REPLACE_WITH_RELEASE_MANIFEST_DIGEST reference from the GitHub Release body}
    user: "10001:10001"
    environment:
      FIVEGPN_RUNTIME: container
    ports:
      - "0.0.0.0:853:853/tcp"
      - "0.0.0.0:80:80/tcp"
      - "0.0.0.0:443:9443/tcp"
      - "0.0.0.0:443:9443/udp"
      - "0.0.0.0:8080:8080/tcp"
      - "0.0.0.0:8443:8443/tcp"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    cgroup: private
    init: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      # Moby default profile f9bc03ec19b2dc4c091449b08e88f85c0caa9f0b,
      # changed only to allow clone3 for CLONE_INTO_CGROUP worker creation.
      - writable-cgroups=true
      - no-new-privileges=true
      - seccomp=./docker/seccomp-5gpn.json
    volumes:
      - type: volume
        source: fivegpn-data
        target: /etc/5gpn
      - type: volume
        source: fivegpn-ui
        target: /opt/5gpn/ui
      - type: bind
        source: ${FIVEGPN_BOOTSTRAP_CONFIG:-./docker/bootstrap/config.env}
        target: /run/5gpn-bootstrap-input/config.env
        read_only: true
    tmpfs:
      - /run/5gpn:uid=10001,gid=10001,mode=0700
      - /run/5gpn-bootstrap:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=1777
      - /var/tmp:uid=10001,gid=10001,mode=1777
    secrets:
      - source: cloudflare_api_token
        target: cloudflare_api_token
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 45s
    pids_limit: 256

volumes:
  fivegpn-data:
    name: ${FIVEGPN_DATA_VOLUME:-fivegpn-data}
  fivegpn-ui:
    name: ${FIVEGPN_UI_VOLUME:-fivegpn-ui}

secrets:
  cloudflare_api_token:
    file: ${CLOUDFLARE_API_TOKEN_FILE:-./docker/bootstrap/cloudflare_api_token}

networks:
  default:
    driver: bridge
    enable_ipv6: false
